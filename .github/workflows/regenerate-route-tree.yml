name: Regenerate Route Tree

on:
  push:
    branches:
      - feat/verified-facts-matcher
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/verified-facts-matcher
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "route tree already synchronized"
            exit 0
          fi
          git add src/routeTree.gen.ts
          git commit -m "chore(routes): regenerate route tree"
          git push origin HEAD:feat/verified-facts-matcher
