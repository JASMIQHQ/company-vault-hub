name: Grant sanitizer regression and production-export fixture

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/sanitize_grants.py
      - tests/test_sanitize_grants.py
      - .github/workflows/sanitize-grants-tests.yml
      - .github/workflows/restore-staging-schema-baseline.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Unit regression suite
        run: python -m pytest -q tests/test_sanitize_grants.py
      - name: Download exact reviewed production schema fixture
        uses: actions/download-artifact@v4
        with:
          name: jasmiq-production-schema-baseline-42649485410
          run-id: 42649485410
          github-token: \${{ github.token }}
          path: fixture
      - name: Sanitize and verify real production SQL fixture
        shell: bash
        run: |
          set -euo pipefail
          test -s fixture/production-schema.sql
          echo "a15cef38a77006e7e237fe7092b1e6f96f6f5ecc8a2636d18cc0aa5b86ece94a  fixture/production-schema.sql" | sha256sum -c -
          python scripts/sanitize_grants.py fixture/production-schema.sql sanitized-production-schema.sql
          python - <<'PY'
          from pathlib import Path
          import re
          original=Path("fixture/production-schema.sql").read_text()
          sanitized=Path("sanitized-production-schema.sql").read_text()
          before=len(re.findall(r"(?i)\bGRANT\b",original))
          after=len(re.findall(r"(?i)\bGRANT\b",sanitized))
          assert after <= before, (before,after)
          unsafe=re.compile(r"(?is)\b(?:TRUNCATE|MAINTAIN)\b.*?\bTO\s+(?:anon|authenticated|PUBLIC|\"anon\"|\"authenticated\")\b")
          assert not unsafe.search(sanitized), "unsafe grant token remains"
          print(f"grant keyword count: before={before}, after={after}")
          print("independent unsafe-role scan: PASS")
          PY
      - name: Archive input/output and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-evidence-\${{ github.run_id }}
          path: |
            fixture/production-schema.sql
            sanitized-production-schema.sql
          if-no-files-found: error
          retention-days: 30
