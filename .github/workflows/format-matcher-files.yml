name: Format Matcher Files

on:
  push:
    branches:
      - feat/verified-facts-matcher
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/verified-facts-matcher
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write supabase/functions/match-tender-evidence/index.ts supabase/functions/match-tender-evidence/matcher-core.ts supabase/functions/match-tender-evidence/matcher-core.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/match-tender-evidence/index.ts supabase/functions/match-tender-evidence/matcher-core.ts supabase/functions/match-tender-evidence/matcher-core.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(matcher): format verified evidence files"
          git push origin HEAD:feat/verified-facts-matcher
