name: PR57 Exact-Commit Lint Parity Audit

on:
  push:
    branches:
      - audit/pr57-lint-parity-20261016

jobs:
  lint-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compare the exact PR #57 base and head commits
        env:
          LINT_BASE_SHA: 3ed0ea815b486a03cdef700c9767f04eacb54754
          LINT_HEAD_SHA: e44257b7ed8dd7a7c30edaa692e6115af56a301c
        run: node .github/scripts/lint-parity.mjs
      - name: Upload exact-commit comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr57-exact-commit-lint-parity
          path: ${{ runner.temp }}/jasmiq-lint-parity/
          if-no-files-found: warn
          retention-days: 30

  build-pr57-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e44257b7ed8dd7a7c30edaa692e6115af56a301c
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
