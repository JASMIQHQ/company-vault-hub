name: Export production schema baseline (read-only, privilege-free)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jasmiq-production-schema-export
  cancel-in-progress: false

jobs:
  export:
    name: Export schema-only baseline from production
    runs-on: ubuntu-latest
    environment: jasmiq-schema-export
    timeout-minutes: 25
    env:
      PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate read-only export credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DB_URL"
          echo "::add-mask::$PRODUCTION_DB_URL"
          node <<'NODE'
          const url = new URL(process.env.PRODUCTION_DB_URL);
          const username = decodeURIComponent(url.username);
          const direct = url.hostname === "db.itqepknvdiedldcyunig.supabase.co" && username === "postgres";
          const pooler = url.hostname.endsWith(".pooler.supabase.com") && username === "postgres.itqepknvdiedldcyunig";
          if (!direct && !pooler) {
            throw new Error("PRODUCTION_DB_URL does not identify the approved production project.");
          }
          NODE
          printf '%s' "$PRODUCTION_DB_URL" > "$RUNNER_TEMP/production-db-url"

      - name: Dump application schemas without data, ACLs, or ownership
        shell: bash
        run: |
          set -euo pipefail
          connection="$(cat "$RUNNER_TEMP/production-db-url")"
          docker pull postgres:17
          docker run --rm --network host \
            --env DATABASE_URL="$connection" \
            --volume "$PWD:/work" \
            postgres:17 sh -ceu '
              pg_dump --version
              pg_dump \
                --schema-only \
                --no-privileges \
                --no-owner \
                --schema=public \
                --schema=private \
                --dbname="$DATABASE_URL" \
                --file=/work/production-schema.sql
            '
          test -s production-schema.sql
          if grep -Eiq '^[[:space:]]*(GRANT|REVOKE|ALTER[[:space:]]+DEFAULT[[:space:]]+PRIVILEGES|ALTER[[:space:]]+.*[[:space:]]OWNER[[:space:]]+TO)([[:space:]]|;)' production-schema.sql; then
            echo "::error::Privilege or ownership statements found in supposedly privilege-free export."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*(COPY|INSERT[[:space:]]+INTO)([[:space:]]|;)' production-schema.sql; then
            echo "::error::Data statements found in schema-only export."
            exit 1
          fi
          sha256sum production-schema.sql | tee production-schema.sha256
          {
            echo "source_project=itqepknvdiedldcyunig"
            echo "source_commit=$GITHUB_SHA"
            echo "schemas=public,private"
            echo "dump_mode=schema-only"
            echo "acl=no-privileges"
            echo "ownership=no-owner"
            docker run --rm postgres:17 pg_dump --version
          } > production-schema-manifest.txt
          echo "Privilege-free schema export completed. No table data was exported."

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: jasmiq-production-schema-baseline-${{ github.run_id }}
          path: |
            production-schema.sql
            production-schema.sha256
            production-schema-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish export summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production schema export — READ ONLY"
            echo "- Source project: `itqepknvdiedldcyunig`"
            echo "- Schemas: public, private"
            echo "- Dump type: schema only; no table rows or Storage objects"
            echo "- ACL statements: excluded by pg_dump --no-privileges"
            echo "- Ownership statements: excluded by pg_dump --no-owner"
            echo "- Artifact: jasmiq-production-schema-baseline-$GITHUB_RUN_ID"
            echo "- SHA-256: $(cat production-schema.sha256 2>/dev/null || echo unavailable)"
            echo "- No production database writes were performed."
          } >> "$GITHUB_STEP_SUMMARY"
