name: Dependency isolation generated artifact refresh

on:
  push:
    branches:
      - fix/dependency-isolation-clean
    paths:
      - package.json
      - bun.lock
      - .github/workflows/dependency-isolation-generated-artifact-refresh.yml

permissions:
  contents: write

jobs:
  refresh-route-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate generated artifacts
        run: bun run build

      - name: Commit route tree only
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No generated changes."
            exit 0
          fi

          echo "$changed"

          if [ "$changed" != "src/routeTree.gen.ts" ]; then
            echo "Unexpected generated changes detected; refusing to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore(routes): regenerate route tree for TanStack update"
          git push origin HEAD:fix/dependency-isolation-clean
