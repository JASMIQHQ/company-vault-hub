name: Clean Bun Re-resolve

on:
  push:
    branches:
      - feat/verified-facts-matcher

permissions:
  contents: write

jobs:
  clean-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Clean install from package.json
        run: |
          rm -rf node_modules bun.lock
          bun install
          echo "=== resolved TanStack family ==="
          bun pm ls @tanstack/react-start @tanstack/react-router @tanstack/router-core @tanstack/router-plugin @tanstack/start-client-core @tanstack/start-plugin-core @tanstack/start-server-core
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bun.lock; then
            echo "No lockfile changes."
          else
            git add bun.lock
            git commit -m "chore(deps): clean re-resolve TanStack dependency graph"
            git push
          fi
