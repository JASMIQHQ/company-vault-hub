name: dependency-isolation-lock-refresh

on:
  push:
    branches:
      - fix/dependency-isolation-clean

permissions:
  contents: write

concurrency:
  group: dependency-isolation-lock-refresh
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): regenerate lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Verify intended dependency resolutions
        run: |
          test -f bun.lock
          grep -q 'eslint@9.39.4' bun.lock
          grep -q '@eslint/js@9.39.4' bun.lock
          grep -q '@eslint/eslintrc@3.3.5' bun.lock
          grep -q '@eslint-community/eslint-utils@4.9.1' bun.lock
          grep -q 'typescript-eslint@8.59.0' bun.lock
          grep -q 'prettier@3.8.3' bun.lock
          grep -q 'eslint-plugin-prettier@5.5.5' bun.lock
          grep -q '@tanstack/react-start@1.168.60' bun.lock
          grep -q '@tanstack/start-server-core@1.169.39' bun.lock

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "No bun.lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): regenerate lockfile"
          git push origin HEAD:fix/dependency-isolation-clean
