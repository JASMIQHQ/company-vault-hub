name: Dependency isolation lock refresh

on:
  push:
    branches:
      - fix/dependency-isolation-clean
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): regenerate bun lockfile"
          git push origin HEAD:fix/dependency-isolation-clean
