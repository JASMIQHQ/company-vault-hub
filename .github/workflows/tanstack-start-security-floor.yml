name: TanStack Start Security Floor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tanstack-start-security-floor:
    name: Enforce patched TanStack Start version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject vulnerable or drifting TanStack Start versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const minimum = [1, 168, 60];
          const compare = (left, right) => {
            for (let i = 0; i < 3; i += 1) {
              if (left[i] !== right[i]) return left[i] - right[i];
            }
            return 0;
          };
          const parseVersion = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value ?? "");
            return match ? match.slice(1).map(Number) : null;
          };

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const declaredText = manifest.dependencies?.["@tanstack/react-start"];
          const declared = parseVersion(declaredText);
          if (!declared) {
            console.error(
              "FAIL: package.json must pin @tanstack/react-start to an exact version; found " + JSON.stringify(declaredText)
            );
            process.exit(1);
          }

          const lock = fs.readFileSync("bun.lock", "utf8");
          const resolvedMatch = lock.match(
            /"@tanstack\/react-start":\s*\["@tanstack\/react-start@(\d+\.\d+\.\d+)/
          );
          const resolvedText = resolvedMatch?.[1];
          const resolved = parseVersion(resolvedText);
          if (!resolved) {
            console.error("FAIL: could not identify the resolved @tanstack/react-start version in bun.lock");
            process.exit(1);
          }

          if (compare(declared, minimum) < 0) {
            console.error("FAIL: package.json declares vulnerable @tanstack/react-start " + declaredText + "; minimum allowed is 1.168.60");
            process.exit(1);
          }
          if (compare(resolved, minimum) < 0) {
            console.error("FAIL: bun.lock resolves vulnerable @tanstack/react-start " + resolvedText + "; minimum allowed is 1.168.60");
            process.exit(1);
          }
          if (compare(declared, resolved) !== 0) {
            console.error("FAIL: package.json pins " + declaredText + ", but bun.lock resolves " + resolvedText);
            process.exit(1);
          }

          console.log("PASS: @tanstack/react-start is pinned and resolved at " + resolvedText + " (minimum 1.168.60)");
          NODE
