name: Tender readiness test

on:
  pull_request:
    paths:
      - "src/lib/tender-readiness.ts"
      - "src/lib/tender-readiness.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/tender-readiness-test.yml"
  push:
    branches:
      - "feat/a5-4-readiness-slice-1"
    paths:
      - "src/lib/tender-readiness.ts"
      - "src/lib/tender-readiness.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/tender-readiness-test.yml"

jobs:
  tender-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tender readiness tests
        run: bun test src/lib/tender-readiness.test.ts
