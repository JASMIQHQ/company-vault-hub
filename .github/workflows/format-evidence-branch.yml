name: Temporary formatter for evidence feature branch

on:
  push:
    branches:
      - work/mvp-evidence-trust-procedural-20261126

permissions:
  contents: write

jobs:
  format-feature-files:
    if: "!contains(github.event.head_commit.message, '[auto-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only PR 100 files
        run: |
          bunx prettier --write \
          '.github/workflows/quality-gate.yml' \
          'src/components/tenders/tender-action-plan.tsx' \
          'src/components/tenders/tender-compliance-card.tsx' \
          'src/components/vault/company-readiness-card.tsx' \
          'src/components/vault/company-vault-groups.tsx' \
          'src/hooks/use-tenders.ts' \
          'src/lib/tenders.ts' \
          'src/routes/_authenticated/tenders.$tenderId.tsx' \
          'src/routes/_authenticated/tenders.index.tsx' \
          'src/routes/_authenticated/vault.tsx' \
          'supabase/functions/_shared/document-classifier.ts' \
          'supabase/functions/_shared/requirement-classification.test.ts' \
          'supabase/functions/_shared/requirement-classification.ts' \
          'supabase/functions/_shared/tender-evidence-match.test.ts' \
          'supabase/functions/_shared/tender-evidence-match.ts' \
          'supabase/functions/match-tender-evidence/index.ts'
      - name: Commit formatting changes to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
          '.github/workflows/quality-gate.yml' \
          'src/components/tenders/tender-action-plan.tsx' \
          'src/components/tenders/tender-compliance-card.tsx' \
          'src/components/vault/company-readiness-card.tsx' \
          'src/components/vault/company-vault-groups.tsx' \
          'src/hooks/use-tenders.ts' \
          'src/lib/tenders.ts' \
          'src/routes/_authenticated/tenders.$tenderId.tsx' \
          'src/routes/_authenticated/tenders.index.tsx' \
          'src/routes/_authenticated/vault.tsx' \
          'supabase/functions/_shared/document-classifier.ts' \
          'supabase/functions/_shared/requirement-classification.test.ts' \
          'supabase/functions/_shared/requirement-classification.ts' \
          'supabase/functions/_shared/tender-evidence-match.test.ts' \
          'supabase/functions/_shared/tender-evidence-match.ts' \
          'supabase/functions/match-tender-evidence/index.ts'
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: format evidence integrity files [auto-format]"
            git push origin HEAD:work/mvp-evidence-trust-procedural-20261126
          fi
