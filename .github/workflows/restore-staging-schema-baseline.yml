name: Staging schema restore (blocked pending reviewed grants allowlist)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: Fail closed until privilege model is approved
    runs-on: ubuntu-latest
    steps:
      - name: Explain restore gate
        shell: bash
        run: |
          echo "::error::Staging restore is intentionally disabled."
          echo "A privilege-free schema export and a reviewed, table-specific grants allowlist are required first."
          echo "The previous regex-based GRANT sanitizer is retired and must not be used."
          echo "No database connection or write was attempted."
          exit 1
