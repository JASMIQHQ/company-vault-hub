name: Staging schema restore (verified production baseline, hardened ACLs)

on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: "Successful read-only production schema export run ID"
        required: true
        type: string
        default: "43885665656"
      artifact_id:
        description: "Exact GitHub artifact ID from that run"
        required: true
        type: string
        default: "14234138047"
      artifact_sha256:
        description: "Expected SHA-256 digest of the downloaded artifact ZIP"
        required: true
        type: string
        default: "fd4a5c746e54a0c556c3942c2c2f393101163b86578b345de1e6a67852f38c0f"
      sql_sha256:
        description: "Expected SHA-256 digest of production-schema.sql"
        required: true
        type: string
        default: "6bf83ec93fc2ae9a9325fea2a6a82593b1d1ea91c4bacbb7373e2d9e8734bbc0"
      confirmation:
        description: "Type exactly: RESTORE JASMIQ SCHEMA TO STAGING ONLY"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: jasmiq-staging-schema-baseline-restore
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify export and build least-privilege ACL allowlist
    runs-on: ubuntu-latest
    environment: jasmiq-schema-export
    timeout-minutes: 30
    env:
      PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
      EXPORT_RUN_ID: ${{ inputs.export_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      EXPECTED_ARTIFACT_SHA: ${{ inputs.artifact_sha256 }}
      EXPECTED_SQL_SHA: ${{ inputs.sql_sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      source_commit: ${{ steps.provenance.outputs.source_commit }}
    steps:
      - name: Validate input formats
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPORT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_SQL_SHA" =~ ^[a-f0-9]{64}$ ]]
          test -n "$PRODUCTION_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify export run and artifact provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPORT_RUN_ID" > export-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and
            .path == ".github/workflows/export-production-schema-baseline.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main"
          ' export-run.json >/dev/null
          source_commit="$(jq -r '.head_sha' export-run.json)"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          expected_name="jasmiq-production-schema-baseline-$EXPORT_RUN_ID"
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$EXPORT_RUN_ID" \
            --arg name "$expected_name" \
            --arg digest "sha256:$EXPECTED_ARTIFACT_SHA" '
              .id == $artifact_id and
              .workflow_run.id == $run_id and
              .name == $name and
              .expired == false and
              .digest == $digest
            ' artifact.json >/dev/null

          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output schema-artifact.zip
          echo "$EXPECTED_ARTIFACT_SHA  schema-artifact.zip" | sha256sum --check

      - name: Validate schema files and source ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir exported
          unzip -q schema-artifact.zip -d exported
          test "$(find exported -maxdepth 1 -type f | wc -l)" -eq 3
          test -f exported/production-schema.sql
          test -f exported/production-schema.sha256
          test -f exported/production-schema-manifest.txt
          cd exported
          test "$(awk '{print $1}' production-schema.sha256)" = "$EXPECTED_SQL_SHA"
          sha256sum --check production-schema.sha256
          grep -Fx "source_project=itqepknvdiedldcyunig" production-schema-manifest.txt
          grep -Fx "schemas=public,private" production-schema-manifest.txt
          grep -Fx "dump_mode=schema-only" production-schema-manifest.txt
          grep -Fx "archive_data_sections=none (verified from pg_restore TOC)" production-schema-manifest.txt
          grep -Fx "acl=no-privileges" production-schema-manifest.txt
          grep -Fx "ownership=no-owner" production-schema-manifest.txt
          manifest_commit="$(awk -F= '$1=="source_commit"{print $2}' production-schema-manifest.txt)"
          test "$manifest_commit" = "$(jq -r '.head_sha' ../export-run.json)"

          if grep -Eiq '^(COPY .* FROM stdin|INSERT INTO|GRANT |REVOKE |ALTER .* OWNER TO)' production-schema.sql; then
            echo "::error::Unexpected data or privilege statement in schema export"
            exit 1
          fi
          test "$(grep -Ec '^CREATE TABLE ' production-schema.sql)" -eq 57
          test "$(grep -Ec '^CREATE FUNCTION ' production-schema.sql)" -eq 46
          test "$(grep -Ec '^CREATE TRIGGER ' production-schema.sql)" -eq 18
          test "$(grep -Ec '^CREATE POLICY ' production-schema.sql)" -eq 43
          test "$(grep -Ec '^CREATE VIEW ' production-schema.sql)" -eq 18
          test "$(grep -Ec '^ALTER TABLE .* ENABLE ROW LEVEL SECURITY;' production-schema.sql)" -eq 57
          cd ..

      - name: Check out the exact source commit and validate migration set
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(jq -r '.head_sha' export-run.json)"
          git fetch origin "$source_commit"
          git checkout --detach "$source_commit"
          node scripts/audit-migration-version-set.mjs
          awk 'length($0) == 14 && $0 ~ /^[0-9]+$/ {print}' supabase/migrations/live-ledger-versions-2026-10-29.txt > source-ledger.txt
          diff -u source-ledger.txt restore-inputs/expected-ledger.txt

      - name: Install PostgreSQL client and Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Verify staging is still empty before any write
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGHOST="db.$STAGING_REF.supabase.co"
          export PGPORT=5432
          export PGUSER=postgres
          export PGDATABASE=postgres
          export PGSSLMODE=require
          relation_count="$(psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND c.relkind IN ('r','p','v','m','S');")"
          migration_count="$(psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM supabase_migrations.schema_migrations;")"
          private_schema_count="$(psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_namespace WHERE nspname='private';")"
          auth_uid_count="$(psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='auth' AND p.proname='uid';")"
          psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT e.extname || '=' || e.extversion || '@' || n.nspname
            FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace
            WHERE e.extname IN ('citext','vector','uuid-ossp','pgcrypto')
            ORDER BY e.extname;" > staging-extensions.txt
          diff -u restore-inputs/required-extensions.txt staging-extensions.txt
          test "$relation_count" -eq 0
          test "$migration_count" -eq 0
          test "$private_schema_count" -eq 0
          test "$auth_uid_count" -eq 1

      - name: Apply schema and hardened ACLs atomically to staging
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export PGHOST="db.$STAGING_REF.supabase.co"
          export PGPORT=5432
          export PGUSER=postgres
          export PGDATABASE=postgres
          export PGSSLMODE=require
          echo "$(cat restore-inputs/production-schema.sha256)"
          (cd restore-inputs && sha256sum --check production-schema.sha256)
          psql -X -v ON_ERROR_STOP=1 --single-transaction \
            -f restore-inputs/production-schema.sql \
            -f restore-inputs/staging-acl.sql

      - name: Mark the exact 66 production migrations as applied on staging
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$STAGING_REF" --password "$STAGING_DB_PASSWORD"
          while IFS= read -r version; do
            [[ "$version" =~ ^[0-9]{14}$ ]]
            supabase migration repair --status applied "$version" --password "$STAGING_DB_PASSWORD"
          done < restore-inputs/live-ledger-versions.txt

      - name: Verify restored schema, RLS, ACLs and migration ledger
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export PGHOST="db.$STAGING_REF.supabase.co"
          export PGPORT=5432
          export PGUSER=postgres
          export PGDATABASE=postgres
          export PGSSLMODE=require
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            tables_count integer;
            views_count integer;
            functions_count integer;
            definer_count integer;
            triggers_count integer;
            policies_count integer;
            rls_count integer;
            force_rls_count integer;
            bad_anon_dml integer;
            bad_truncate integer;
            bad_definer_execute integer;
            bad_definer_path integer;
            bad_function_path integer;
            bad_view_access integer;
            bad_default_acl integer;
            extension_count integer;
            auth_select integer;
            auth_insert integer;
            auth_update integer;
            auth_delete integer;
            service_select integer;
            service_insert integer;
            service_update integer;
            service_delete integer;
          BEGIN
            SELECT count(*) INTO tables_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p');
            SELECT count(*) INTO views_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind='v';
            SELECT count(*) INTO functions_count FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres');
            SELECT count(*) INTO definer_count FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres') AND p.prosecdef;
            SELECT count(*) INTO triggers_count FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
              JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal;
            SELECT count(*) INTO policies_count FROM pg_policies WHERE schemaname='public';
            SELECT count(*) INTO rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relrowsecurity;
            SELECT count(*) INTO force_rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relforcerowsecurity;

            SELECT count(*) INTO bad_anon_dml FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND
                (has_table_privilege('anon',c.oid,'SELECT') OR has_table_privilege('anon',c.oid,'INSERT')
                 OR has_table_privilege('anon',c.oid,'UPDATE') OR has_table_privilege('anon',c.oid,'DELETE'));
            SELECT count(*) INTO bad_truncate FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND
                (has_table_privilege('anon',c.oid,'TRUNCATE') OR has_table_privilege('authenticated',c.oid,'TRUNCATE')
                 OR has_table_privilege('service_role',c.oid,'TRUNCATE') OR
                 has_table_privilege('anon',c.oid,'MAINTAIN') OR has_table_privilege('authenticated',c.oid,'MAINTAIN')
                 OR has_table_privilege('service_role',c.oid,'MAINTAIN'));
            SELECT count(*) INTO bad_definer_execute FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres')
                AND p.prosecdef AND has_function_privilege('anon',p.oid,'EXECUTE');
            SELECT count(*) INTO bad_definer_path FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres')
                AND p.prosecdef AND NOT EXISTS
                  (SELECT 1 FROM unnest(coalesce(p.proconfig,ARRAY[]::text[])) AS cfg(setting) WHERE cfg.setting LIKE 'search_path=%');
            SELECT count(*) INTO bad_function_path FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres')
                AND NOT EXISTS
                  (SELECT 1 FROM unnest(coalesce(p.proconfig,ARRAY[]::text[])) AS cfg(setting) WHERE cfg.setting LIKE 'search_path=%');
            SELECT count(*) INTO bad_view_access FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind='v'
                AND (has_table_privilege('anon',c.oid,'SELECT')
                  OR has_table_privilege('authenticated',c.oid,'SELECT')
                  OR has_table_privilege('service_role',c.oid,'SELECT'));
            SELECT count(*) INTO bad_default_acl
            FROM pg_default_acl d JOIN pg_roles owner_role ON owner_role.oid=d.defaclrole
            CROSS JOIN LATERAL aclexplode(d.defaclacl) a
            LEFT JOIN pg_roles grantee_role ON grantee_role.oid=a.grantee
            WHERE owner_role.rolname='postgres'
              AND ((d.defaclobjtype='r' AND d.defaclnamespace=(SELECT oid FROM pg_namespace WHERE nspname='public')
                    AND (a.grantee=0 OR grantee_role.rolname IN ('anon','authenticated','service_role')))
                OR (d.defaclobjtype='f' AND d.defaclnamespace=0
                    AND (a.grantee=0 OR grantee_role.rolname IN ('anon','authenticated','service_role')))
                OR (d.defaclobjtype='f' AND d.defaclnamespace=(SELECT oid FROM pg_namespace WHERE nspname='public')
                    AND (a.grantee=0 OR grantee_role.rolname IN ('anon','authenticated','service_role'))));
            SELECT count(*) INTO extension_count FROM pg_extension
              WHERE extname IN ('citext','vector','uuid-ossp','pgcrypto');

            SELECT count(*) INTO auth_select FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'SELECT');
            SELECT count(*) INTO auth_insert FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'INSERT');
            SELECT count(*) INTO auth_update FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'UPDATE');
            SELECT count(*) INTO auth_delete FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'DELETE');
            SELECT count(*) INTO service_select FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'SELECT');
            SELECT count(*) INTO service_insert FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'INSERT');
            SELECT count(*) INTO service_update FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'UPDATE');
            SELECT count(*) INTO service_delete FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'DELETE');

            IF tables_count<>57 OR views_count<>18 OR functions_count<>46 OR definer_count<>30
              OR triggers_count<>18 OR policies_count<>43 OR rls_count<>57 OR force_rls_count<>0
              OR bad_anon_dml<>0 OR bad_truncate<>0 OR bad_definer_execute<>0 OR bad_definer_path<>0
              OR bad_function_path<>0 OR bad_view_access<>0 OR bad_default_acl<>0 OR extension_count<>4
              OR auth_select<>24 OR auth_insert<>7 OR auth_update<>7 OR auth_delete<>6
              OR service_select<>11 OR service_insert<>3 OR service_update<>5 OR service_delete<>2
              OR NOT has_schema_privilege('authenticated','private','USAGE')
              OR has_schema_privilege('anon','private','USAGE')
              OR has_schema_privilege('service_role','private','USAGE') THEN
              RAISE EXCEPTION 'Staging baseline verification failed. tables %, views %, funcs %, definers %, triggers %, policies %, RLS %, FORCE %, anon DML %, unsafe truncate %, definer anon exec %, definer path %, auth DML %/%/%/%, service DML %/%/%/%.',
                tables_count,views_count,functions_count,definer_count,triggers_count,policies_count,rls_count,
                force_rls_count,bad_anon_dml,bad_truncate,bad_definer_execute,bad_definer_path,
                auth_select,auth_insert,auth_update,auth_delete,service_select,service_insert,service_update,service_delete;
            END IF;
          END
          $verify$;
          SQL

          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" > actual-ledger.txt
          diff -u restore-inputs/live-ledger-versions.txt actual-ledger.txt
          test "$(wc -l < actual-ledger.txt)" -eq 66

      - name: Upload staging restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasmiq-staging-schema-restore-${{ github.run_id }}
          path: |
            restore-inputs/
            actual-ledger.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish restore summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging schema baseline restore"
            echo "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Target: staging only ($STAGING_REF)"
            echo "- Source export run: ${{ inputs.export_run_id }}"
            echo "- Source commit: ${{ needs.prepare.outputs.source_commit }}"
            echo "- Schema SHA-256: ${{ inputs.sql_sha256 }}"
            echo "- Production was queried read-only; no production writes were performed."
            echo "- No Edge Functions or Storage buckets were deployed or created."
            echo "- Restore is complete only if all verification steps pass."
          } >> "$GITHUB_STEP_SUMMARY"
 supabase/migrations/live-ledger-versions-2026-10-29.txt) \
            restore-inputs/expected-ledger.txt

      - name: Install PostgreSQL client and Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Verify staging is still empty before any write
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGHOST="db.$STAGING_REF.supabase.co"
          export PGPORT=5432
          export PGUSER=postgres
          export PGDATABASE=postgres
          export PGSSLMODE=require
          relation_count="$(psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND c.relkind IN ('r','p','v','m','S');")"
          migration_count="$(psql -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM supabase_migrations.schema_migrations;")"
          test "$relation_count" -eq 0
          test "$migration_count" -eq 0

      - name: Apply schema and hardened ACLs atomically to staging
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export PGHOST="db.$STAGING_REF.supabase.co"
          export PGPORT=5432
          export PGUSER=postgres
          export PGDATABASE=postgres
          export PGSSLMODE=require
          echo "$(cat restore-inputs/production-schema.sha256)"
          psql -X -v ON_ERROR_STOP=1 --single-transaction \
            -f restore-inputs/production-schema.sql \
            -f restore-inputs/staging-acl.sql

      - name: Mark the exact 66 production migrations as applied on staging
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$STAGING_REF" --password "$STAGING_DB_PASSWORD"
          while IFS= read -r version; do
            [[ "$version" =~ ^[0-9]{14}$ ]]
            supabase migration repair --status applied "$version" --password "$STAGING_DB_PASSWORD"
          done < restore-inputs/live-ledger-versions.txt

      - name: Verify restored schema, RLS, ACLs and migration ledger
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export PGHOST="db.$STAGING_REF.supabase.co"
          export PGPORT=5432
          export PGUSER=postgres
          export PGDATABASE=postgres
          export PGSSLMODE=require
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            tables_count integer;
            views_count integer;
            functions_count integer;
            definer_count integer;
            triggers_count integer;
            policies_count integer;
            rls_count integer;
            force_rls_count integer;
            bad_anon_dml integer;
            bad_truncate integer;
            bad_definer_execute integer;
            bad_definer_path integer;
            auth_select integer;
            auth_insert integer;
            auth_update integer;
            auth_delete integer;
            service_select integer;
            service_insert integer;
            service_update integer;
            service_delete integer;
          BEGIN
            SELECT count(*) INTO tables_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p');
            SELECT count(*) INTO views_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind='v';
            SELECT count(*) INTO functions_count FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres');
            SELECT count(*) INTO definer_count FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres') AND p.prosecdef;
            SELECT count(*) INTO triggers_count FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
              JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal;
            SELECT count(*) INTO policies_count FROM pg_policies WHERE schemaname='public';
            SELECT count(*) INTO rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relrowsecurity;
            SELECT count(*) INTO force_rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relforcerowsecurity;

            SELECT count(*) INTO bad_anon_dml FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND
                (has_table_privilege('anon',c.oid,'SELECT') OR has_table_privilege('anon',c.oid,'INSERT')
                 OR has_table_privilege('anon',c.oid,'UPDATE') OR has_table_privilege('anon',c.oid,'DELETE'));
            SELECT count(*) INTO bad_truncate FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND
                (has_table_privilege('anon',c.oid,'TRUNCATE') OR has_table_privilege('authenticated',c.oid,'TRUNCATE')
                 OR has_table_privilege('service_role',c.oid,'TRUNCATE') OR
                 has_table_privilege('anon',c.oid,'MAINTAIN') OR has_table_privilege('authenticated',c.oid,'MAINTAIN')
                 OR has_table_privilege('service_role',c.oid,'MAINTAIN'));
            SELECT count(*) INTO bad_definer_execute FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres')
                AND p.prosecdef AND has_function_privilege('anon',p.oid,'EXECUTE');
            SELECT count(*) INTO bad_definer_path FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname IN ('public','private') AND p.proowner=(SELECT oid FROM pg_roles WHERE rolname='postgres')
                AND p.prosecdef AND NOT EXISTS
                  (SELECT 1 FROM unnest(coalesce(p.proconfig,ARRAY[]::text[])) AS cfg(setting) WHERE cfg.setting LIKE 'search_path=%');

            SELECT count(*) INTO auth_select FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'SELECT');
            SELECT count(*) INTO auth_insert FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'INSERT');
            SELECT count(*) INTO auth_update FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'UPDATE');
            SELECT count(*) INTO auth_delete FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('authenticated',c.oid,'DELETE');
            SELECT count(*) INTO service_select FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'SELECT');
            SELECT count(*) INTO service_insert FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'INSERT');
            SELECT count(*) INTO service_update FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'UPDATE');
            SELECT count(*) INTO service_delete FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND has_table_privilege('service_role',c.oid,'DELETE');

            IF tables_count<>57 OR views_count<>18 OR functions_count<>46 OR definer_count<>30
              OR triggers_count<>18 OR policies_count<>43 OR rls_count<>57 OR force_rls_count<>0
              OR bad_anon_dml<>0 OR bad_truncate<>0 OR bad_definer_execute<>0 OR bad_definer_path<>0
              OR auth_select<>24 OR auth_insert<>7 OR auth_update<>7 OR auth_delete<>6
              OR service_select<>11 OR service_insert<>3 OR service_update<>5 OR service_delete<>2
              OR NOT has_schema_privilege('authenticated','private','USAGE')
              OR has_schema_privilege('anon','private','USAGE')
              OR has_schema_privilege('service_role','private','USAGE') THEN
              RAISE EXCEPTION 'Staging baseline verification failed. tables %, views %, funcs %, definers %, triggers %, policies %, RLS %, FORCE %, anon DML %, unsafe truncate %, definer anon exec %, definer path %, auth DML %/%/%/%, service DML %/%/%/%.',
                tables_count,views_count,functions_count,definer_count,triggers_count,policies_count,rls_count,
                force_rls_count,bad_anon_dml,bad_truncate,bad_definer_execute,bad_definer_path,
                auth_select,auth_insert,auth_update,auth_delete,service_select,service_insert,service_update,service_delete;
            END IF;
          END
          $verify$;
          SQL

          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" > actual-ledger.txt
          diff -u restore-inputs/live-ledger-versions.txt actual-ledger.txt
          test "$(wc -l < actual-ledger.txt)" -eq 66

      - name: Upload staging restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasmiq-staging-schema-restore-${{ github.run_id }}
          path: |
            restore-inputs/
            actual-ledger.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish restore summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging schema baseline restore"
            echo "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Target: staging only ($STAGING_REF)"
            echo "- Source export run: ${{ inputs.export_run_id }}"
            echo "- Source commit: ${{ needs.prepare.outputs.source_commit }}"
            echo "- Schema SHA-256: ${{ inputs.sql_sha256 }}"
            echo "- Production was queried read-only; no production writes were performed."
            echo "- No Edge Functions or Storage buckets were deployed or created."
            echo "- Restore is complete only if all verification steps pass."
          } >> "$GITHUB_STEP_SUMMARY"
