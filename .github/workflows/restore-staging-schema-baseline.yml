name: Restore verified production schema to staging (schema-only)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful production schema export run ID"
        required: true
        type: string
      source_sql_sha256:
        description: "Expected SHA-256 of production-schema.sql"
        required: true
        type: string
      confirmation:
        description: "Type exactly: RESTORE VERIFIED SCHEMA TO JASMIQ STAGING"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: jasmiq-staging-schema-baseline-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Restore schema-only baseline to jasmiq-staging
    runs-on: ubuntu-latest
    environment: jasmiq-staging
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      EXPECTED_SQL_SHA: ${{ inputs.source_sql_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      STAGING_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - name: Validate approval, source provenance, and exact staging target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SQL_SHA" =~ ^[a-f0-9]{64}$ ]]
          test "$CONFIRMATION" = "RESTORE VERIFIED SCHEMA TO JASMIQ STAGING"
          test "$STAGING_REF" = "rmtoaaxnuwsecmajhwjx"
          test "$STAGING_REF" != "itqepknvdiedldcyunig"
          test -n "$STAGING_DB_PASSWORD"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          jq -e --arg repo "${GITHUB_REPOSITORY}" '
            .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/export-production-schema-baseline.yml" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == "737a73e9daa03af251bdb602c703310f6d2459e2"
          ' source-run.json >/dev/null
      - name: Download exact reviewed production export artifact
        uses: actions/download-artifact@v4
        with:
          name: jasmiq-production-schema-baseline-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source-artifact
      - name: Verify immutable source SQL and produce restricted staging copy
        shell: bash
        run: |
          set -euo pipefail
          test -s source-artifact/production-schema.sql
          test -s source-artifact/production-schema.sha256
          recorded="$(awk '{print $1}' source-artifact/production-schema.sha256)"
          actual="$(sha256sum source-artifact/production-schema.sql | awk '{print $1}')"
          test "$recorded" = "$actual"
          test "$actual" = "$EXPECTED_SQL_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_bytes = Path("source-artifact/production-schema.sql").read_bytes()
source = source_bytes.decode("utf-8")
          output = []
          removed = 0
          for line in source.splitlines():
              # Only alter GRANT / ALTER DEFAULT PRIVILEGES statements whose
              # grantee is anon or authenticated. Preserve all other grants.
              match = re.match(r'^(.*?\bGRANT\s+)(.*?)\s+(ON\s+.*?\s+TO\s+)(.*?);\s*$', line, re.I)
              if match and re.search(r'"(?:anon|authenticated)"', match.group(3) + match.group(4), re.I):
                  privileges = [p.strip() for p in match.group(2).split(",")]
                  kept = [p for p in privileges if p.upper() not in {"TRUNCATE", "MAINTAIN"}]
                  removed += len(privileges) - len(kept)
                  if kept:
                      line = match.group(1) + ",".join(kept) + " " + match.group(3) + match.group(4) + ";"
                  else:
                      # A privilege-only grant with no remaining privileges
                      # is omitted rather than emitting invalid SQL.
                      continue
              output.append(line)

          sanitized = "\n".join(output) + "\n"
          # Revoke target-project inherited table defaults before restoring.
          prelude = (
              "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public "
              "REVOKE ALL ON TABLES FROM anon, authenticated;\n"
          )
          sanitized = prelude + sanitized
          forbidden = re.compile(
              r'^(?:.*?\bGRANT\s+[^;]*?\b(?:TRUNCATE|MAINTAIN)\b[^;]*?\bTO\s+.*?"(?:anon|authenticated)".*?;)',
              re.I | re.M,
          )
          if forbidden.search(sanitized):
              raise SystemExit("Unsafe TRUNCATE/MAINTAIN privilege remains for anon/authenticated")
          Path("staging-schema.sql").write_text(sanitized)
          Path("sanitization-report.txt").write_text(
              f"Original SQL SHA-256: {__import__('hashlib').sha256(source_bytes).hexdigest()}\n"
              f"Staging SQL SHA-256: {__import__('hashlib').sha256(sanitized.encode()).hexdigest()}\n"
              f"Removed TRUNCATE/MAINTAIN privilege tokens for anon/authenticated: {removed}\n"
              "Original production artifact was not modified.\n"
          )
          print(Path("sanitization-report.txt").read_text())
          PY
          sha256sum staging-schema.sql > staging-schema.sha256
      - name: Install PostgreSQL client and build staging-only connection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export STAGING_DB_PASSWORD
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import quote
          password = quote(os.environ["STAGING_DB_PASSWORD"], safe="")
          ref = "rmtoaaxnuwsecmajhwjx"
          print("STAGING_DB_URL=postgresql://postgres." + ref + ":" + password + "@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require")
          PY
      - name: Confirm staging is empty before restore
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_REF" = "rmtoaaxnuwsecmajhwjx"
          count="$(psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            SELECT count(*)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname IN ('public','private')
              AND c.relkind IN ('r','p','v','m','S','f');
          ")"
          test "$count" = "0" || {
            echo "::error::Staging is not empty (found $count objects). Refusing to overwrite."
            exit 1
          }
      - name: Restore sanitized schema in one transaction
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_DB_URL" -X --single-transaction --set ON_ERROR_STOP=1 --file staging-schema.sql
      - name: Verify restored schema, RLS, policies, and restricted grants
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            table_count integer;
            rls_count integer;
            view_count integer;
            policy_count integer;
            trigger_count integer;
            unsafe_grant_count integer;
          BEGIN
            SELECT count(*) INTO table_count
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND c.relkind IN ('r','p');
            SELECT count(*) INTO rls_count
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND c.relkind IN ('r','p') AND c.relrowsecurity;
            SELECT count(*) INTO view_count
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND c.relkind IN ('v','m');
            SELECT count(*) INTO policy_count
            FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private');
            SELECT count(*) INTO trigger_count
            FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND NOT t.tgisinternal;
            SELECT count(*) INTO unsafe_grant_count
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private')
              AND (has_table_privilege('anon', c.oid, 'TRUNCATE')
                OR has_table_privilege('anon', c.oid, 'MAINTAIN')
                OR has_table_privilege('authenticated', c.oid, 'TRUNCATE')
                OR has_table_privilege('authenticated', c.oid, 'MAINTAIN'));
            IF table_count <> 57 THEN RAISE EXCEPTION 'Expected 57 tables; found %', table_count; END IF;
            IF rls_count <> table_count THEN RAISE EXCEPTION 'RLS missing: % of % tables enabled', rls_count, table_count; END IF;
            IF policy_count <> 43 THEN RAISE EXCEPTION 'Expected 43 policies; found %', policy_count; END IF;
            IF unsafe_grant_count <> 0 THEN RAISE EXCEPTION 'Unsafe TRUNCATE/MAINTAIN grants found: %', unsafe_grant_count; END IF;
            RAISE NOTICE 'Verified tables=%, RLS-enabled=%, views=%, policies=%, triggers=%',
              table_count, rls_count, view_count, policy_count, trigger_count;
          END
          $verify$;
          SQL
          psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -c "
            SELECT n.nspname AS schema, c.relkind, count(*) AS objects
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private')
            GROUP BY n.nspname,c.relkind ORDER BY n.nspname,c.relkind;
          " | tee post-restore-inventory.txt
      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasmiq-staging-schema-restore-${{ github.run_id }}
          path: |
            source-run.json
            sanitization-report.txt
            staging-schema.sha256
            post-restore-inventory.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Publish restore summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging schema-only restore"
            echo "- Target: jasmiq-staging (rmtoaaxnuwsecmajhwjx)"
            echo "- Source export run: $SOURCE_RUN_ID"
            echo "- Expected source SQL SHA-256: $EXPECTED_SQL_SHA"
            echo "- Production database was not used as a restore target."
            echo "- No production data, Storage objects, Auth users, or Edge Functions were copied."
            echo "- Review artifact: jasmiq-staging-schema-restore-$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
