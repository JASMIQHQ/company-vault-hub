name: regenerate-bun-lock

on:
  push:
    branches:
      - feat/verified-facts-matcher

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/verified-facts-matcher
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Verify TanStack versions
        run: |
          bun pm ls @tanstack/react-start @tanstack/start-server-core

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): regenerate Bun lockfile for TanStack security fix"
          git push origin HEAD:feat/verified-facts-matcher
