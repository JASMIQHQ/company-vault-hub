name: Route tree drift check

# Guard invariant: the committed generated tree must match a fresh build.
# TanStack Start can rewrite its trailing type-registration block between
# generator versions; that metadata is normalized before comparison so real
# route drift remains a hard failure.

on:
  pull_request:
    paths:
      - "src/routes/**"
      - "src/components/tenders/**"
      - "src/components/vault/**"
      - "src/hooks/**"
      - "src/lib/**"
      - "src/routeTree.gen.ts"
      - "src/router.tsx"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/route-tree-drift-check.yml"
  push:
    branches:
      - "main"
    paths:
      - "src/routes/**"
      - "src/components/tenders/**"
      - "src/components/vault/**"
      - "src/hooks/**"
      - "src/lib/**"
      - "src/routeTree.gen.ts"
      - "src/router.tsx"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/route-tree-drift-check.yml"

jobs:
  route-tree-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build application
        run: bun run build

      - name: Verify tender detail route is registered
        run: |
          if ! grep -q '\$tenderId' src/routeTree.gen.ts; then
            echo "ERROR: src/routeTree.gen.ts does not register the /tenders/$tenderId route."
            exit 1
          fi

      - name: Verify committed route tree matches build output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          import difflib

          generated = Path("src/routeTree.gen.ts").read_text()
          committed = subprocess.check_output(["git", "show", "HEAD:src/routeTree.gen.ts"], text=True)

          def normalize(value: str) -> str:
              return re.sub(r"\nimport type \{ getRouter \} from './router\.tsx'.*\Z", "\n", value, flags=re.S)

          generated_normalized = normalize(generated)
          committed_normalized = normalize(committed)

          if generated_normalized != committed_normalized:
              print("::error::committed src/routeTree.gen.ts has real route drift.")
              print("--- DIFF (committed vs freshly generated, normalized) ---")
              diff = difflib.unified_diff(
                  committed_normalized.splitlines(keepends=True),
                  generated_normalized.splitlines(keepends=True),
                  fromfile="committed/src/routeTree.gen.ts",
                  tofile="generated/src/routeTree.gen.ts",
              )
              print("".join(diff), end="")
              print("--- END DIFF ---")
              print("Only TanStack's trailing type-registration metadata is ignored by normalization.")
              raise SystemExit(1)

          print("Route tree verified cleanly.")
          PY
