name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-parity:
    name: Lint parity (base vs head)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compare lint findings against the base commit
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/lint-parity.mjs
      - name: Upload lint comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/jasmiq-lint-parity/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build candidate
    runs-on: ubuntu-latest
    needs: lint-parity
    # Build still runs when lint parity finds regressions so the two results are independently visible.
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Test Supabase staging isolation configuration
        run: bun test src/integrations/supabase/resolve-config.test.ts
      - run: bun run build
